function drawRegister(){const q=(document.getElementById('f-q')?.value||'').toLowerCase(),b=document.getElementById('f-b')?.value||'All',s=document.getElementById('f-s')?.value||'All',cat=document.getElementById('f-c')?.value||'All',reg=document.getElementById('f-r')?.value||'All',src=document.getElementById('f-source')?.value||'All',from=document.getElementById('f-from')?.value||'',to=document.getElementById('f-to')?.value||'',sort=document.getElementById('f-sort')?.value||'new';let rows=cases.filter(c=>(b==='All'||c[3]===b)&&(s==='All'||c[6]===s)&&(cat==='All'||c[4]===cat)&&(reg==='All'||regionOf(c)===reg)&&(src==='All'||c[3]===src)&&(!from||dateValue(c[5])>=dateValue(from))&&(!to||dateValue(c[5])<=dateValue(to))&&c.join(' ').toLowerCase().includes(q));rows.sort((a,b)=>sort==='az'?a[1].localeCompare(b[1]):sort==='old'?dateValue(a[5])-dateValue(b[5]):dateValue(b[5])-dateValue(a[5]));const pages=Math.max(1,Math.ceil(rows.length/10));listPage=Math.min(listPage,pages);const visible=rows.slice((listPage-1)*10,listPage*10),el=document.getElementById('registerTable');if(!el)return;el.innerHTML=`<div class="panel-title"><span>Total Complaints: ${rows.length}</span><span class="more">Sort by <select id="f-sort" onchange="drawRegister()"><option value="new" ${sort==='new'?'selected':''}>Newest First</option><option value="old" ${sort==='old'?'selected':''}>Oldest First</option><option value="az" ${sort==='az'?'selected':''}>Institution A–Z</option></select>　${btn('⇩ Export','exportCases()','small')}</span></div>${visible.length?table(visible.map((c,i)=>[i+1+(listPage-1)*10,`<a class="link" onclick="openCase('${esc(c[0])}')">${esc(c[0])}</a>`,esc(c[1]),esc(c[2]),`<span class="pill ${c[3]==='PGRC'?'green':c[3]==='APC'?'amber':c[3]==='Academic Cell'?'purple':''}">${esc(c[3])}</span>`,esc(c[4]),esc(c[5]),pill(esc(c[6])),btn('View',`openCase('${esc(c[0])}')`,'small'),btn('⋮',`caseMenu('${esc(c[0])}')`,'small')]),['#','Complaint ID','Institution Name','AICTE ID','Bureau / Cell','Category','Received Date','Status','Action','More']):'<p class="subtle">No complaint records match these filters.</p>'}`;const pager=document.getElementById('registerPager');if(pager)pager.innerHTML=`Showing ${rows.length?((listPage-1)*10+1):0}–${Math.min(listPage*10,rows.length)} of ${rows.length} complaints <span style="float:right">${btn('‹','listPage=Math.max(1,listPage-1);drawRegister()','small')}　${Array.from({length:Math.min(5,pages)},(_,i)=>btn(String(i+1),`listPage=${i+1};drawRegister()`,'small'))}　${btn('›',`listPage=Math.min(${pages},listPage+1);drawRegister()`,'small')}</span>`}
function resetFilters(){['f-q','f-from','f-to'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});['f-b','f-s','f-c','f-r','f-source','f-sort'].forEach(id=>{const e=document.getElementById(id);if(e)e.selectedIndex=0});listPage=1;drawRegister()}
function caseMenu(id){const c=getCase(id);pop(`<h2>Case actions</h2><p><b>${esc(c[0])}</b> · ${esc(c[1])}</p><div class="actions" style="flex-wrap:wrap">${btn('Open case',`closeModal();openCase('${esc(id)}')`)}${btn('Edit case',`closeModal();editCase('${esc(id)}')`)}${btn('Mark disposed',`closeModal();caseStatus('${esc(id)}','Disposed')`,'green')}${btn('Transfer',`closeModal();transferCase('${esc(id)}')`)}${btn('Add note',`closeModal();addNote('${esc(id)}')`)}</div>`)}
function detail(){const c=getCase();if(!c)return head('No cases');const related=relatedCases(c),docs=c[11]||[],actions=c[13]||[],notes=c[10]||[];return `<div class="subtle"><a class="link" onclick="go('register')">Complaint Register</a>　›　${esc(c[0])}</div>${head(`${esc(c[0])}　${pill(esc(c[6]))}`,`${esc(c[4])} - Institution complaint`,`${btn('Mark as Disposed',`caseStatus('${esc(c[0])}','Disposed')`,'green')}${btn('Transfer',`transferCase('${esc(c[0])}')`)}${btn('Add Note',`addNote('${esc(c[0])}')`)}${btn('⋮',`caseMenu('${esc(c[0])}')`)}`)}<div class="detail-top panel"><div class="slot"><b>♜ ${esc(c[1])}</b><div class="subtle">AICTE ID: ${esc(c[2])}</div></div><div class="slot">Bureau / Cell<br><b>${esc(c[3])} · ${esc(bureauName(c[3]))}</b></div><div class="slot">Assigned Officer<br><b>${esc(c[7])}</b><div class="subtle">Case owner</div></div><div class="slot">Received Date<br><b>${esc(c[5])}</b></div><div class="slot">Expected Disposal<br><b>${esc(c[8]||'Not set')}</b><div>${pill(c[6]==='Overdue'?'Overdue':'Timeline tracked')}</div></div></div><div class="tabs">${[['overview','Overview'],['history','Actions & History'],['related','Related Cases ('+related.length+')'],['documents','Documents ('+docs.length+')'],['notes','Notes ('+notes.length+')']].map(([key,label])=>`<div class="tab ${caseTab===key?'active':''}" onclick="caseTab='${key}';render()">${label}</div>`).join('')}</div>${caseTab==='overview'?`<div class="columns"><div><section class="panel"><div class="panel-title">Complaint Details ${btn('✎ Edit',`editCase('${esc(c[0])}')`,'small')}</div><div class="details-grid">${[['Complaint ID',c[0]],['Institution Name',c[1]],['Category',c[4]],['AICTE Permanent ID',c[2]],['Sub-category','Recognition / Extension'],['Bureau / Cell',c[3]],['Nature of Complaint',c[9]||'Complaint description pending'],['Address',regionOf(c)],['Description',c[9]||'No description recorded'],['State / Region',regionOf(c)],['Current Status',c[6]],['Complainant Type','Institution'],['Date of Receipt',c[5]],['Assigned Officer',c[7]]].map(x=>`<div class="detail-item"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div></section><section class="panel"><div class="panel-title">Related Cases (${related.length}) <span class="more">${btn('Link Another Case',`linkCase('${esc(c[0])}')`,'small')}</span></div>${relatedTableFor(c)}</section></div><div><section class="panel"><div class="panel-title">Case Timeline <span class="more" onclick="caseTab='history';render()">View All →</span></div>${history(c)}</section><section class="panel"><div class="panel-title">Assigned Actions ${btn('+ Add',`addAction('${esc(c[0])}')`,'small')}</div>${actions.map((a,i)=>`<label class="checkrow"><input type="checkbox" ${a.done?'checked':''} onchange="toggleAction('${esc(c[0])}',${i},this.checked)"><span>${esc(a.text)}<small class="subtle">Due: ${esc(a.due||'Not set')}</small></span><span class="pill ${a.priority==='High'?'red':'amber'}">${a.priority||'Normal'}</span></label>`).join('')||'<span class="subtle">No actions assigned.</span>'}</section><section class="panel"><div class="panel-title">Supporting Documents (${docs.length}) ${btn('＋ Add document',`addDemoDocument('${esc(c[0])}')`,'small')}</div>${docs.map((d,i)=>`<div class="checkrow">📄　${esc(d.name)} <small class="subtle">${esc(d.type||'File')} · ${esc(d.size||'Demo')}</small><span style="margin-left:auto">${btn('⇩',`downloadDoc('${esc(c[0])}',${i})`,'small')}</span></div>`).join('')||'<span class="subtle">No supporting documents.</span>'}</section></div></div>`:caseTab==='history'?`<section class="panel"><div class="panel-title">Chronological Actions & History ${btn('＋ Record action',`addAction('${esc(c[0])}')`,'small')}</div>${history(c)}${actions.map((a,i)=>`<div class="checkrow"><input type="checkbox" ${a.done?'checked':''} onchange="toggleAction('${esc(c[0])}',${i},this.checked)">${esc(a.text)} · ${a.done?'Complete':'Open'}</div>`).join('')}</section>`:caseTab==='related'?`<section class="panel"><div class="pan function addDemoDocument(id){const name=prompt('Document filename to add to this demo case:');if(!name)return;const c=getCase(id);c[11]=c[11]||[];c[11].push({name,type:name.split('.').pop().toUpperCase(),size:'Demo file'});record('Document metadata added',id+' · '+name);saveDB();render()}
function downloadDoc(id,index){const d=getCase(id)[11][index],txt=`CaseSync synthetic demo document\nCase: ${id}\nDocument: ${d.name}\nThis file represents a sample attachment in the local prototype.`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=d.name.replace(/\.[^.]+$/,'')+'-demo.txt';a.click();URL.revokeObjectURL(a.href);record('Demo document downloaded',id+' · '+d.name)}
function related(){const c=getCase(),group=relatedCases(c),rbc=group.filter(x=>x[3]==='RB').length,pgrc=group.filter(x=>x[3]==='PGRC').length,other=group.length-rbc-pgrc,opened=group.filter(x=>x[6]!=='Disposed').length,disposed=group.length-opened;return head('Related Cases','Identify and manage complaints linked to the same institution across AICTE Bureaus & Cells.')+`<section class="panel institution"><div class="inst-icon">♜</div><div style="flex:1"><h2>${esc(c[1])} <span class="pill green">◆ Active</span></h2><div class="subtle">AICTE Permanent ID: ${esc(c[2])}　|　Private　|　⌖ ${esc(regionOf(c))}　|　Established: 2010</div></div>${btn('View Institution Profile →',"go('institution')")}</section><div class="cards grid" style="grid-template-columns:repeat(6,minmax(0,1fr))">${kpiLine('▤','Total Related Cases',group.length)}${kpiLine('♧','RB Cases',rbc)}${kpiLine('✓','PGRC Cases',pgrc,'green')}${kpiLine('♧','Other Bureaus/Cells',other,'purple')}${kpiLine('◷','Open Cases',opened,'amber')}${kpiLine('✓','Disposed Cases',disposed,'green')}</div><div class="alert" style="margin-bottom:12px"><b style="font-size:22px">⚠</b><div style="flex:1"><b>${group.length>1?'Potential Overlapping Cases Detected':'No overlapping cases detected'}</b><div class="subtle">Same institution ID links these records. Review before coordinating.</div></div><span class="pill red">${group.length>1?group.length-1:0} Potential Matches</span>${btn('View Overlap Details',"document.getElementById('overlap-analysis').scrollIntoView()")}</div><section class="panel"><div class="panel-title">Related Complaints & Cases <span class="more">${btn('+ Link Related Case',`linkCase('${esc(c[0])}')`,'small')}</span></div>${table(group.map((x,i)=>[i+1,`<a class="link" onclick="openCase('${esc(x[0])}')">${esc(x[0])}</a>`,`<span class="pill ${x[3]==='PGRC'?'green':x[3]==='APC'?'amber':''}">${esc(x[3])}</span>`,esc(x[4]),pill(esc(x[6])),esc(x[5]),esc(x[7]),btn('View',`openCase('${esc(x[0])}')`,'small')]),['#','Complaint ID','Bureau / Cell','Category','Status','Received Date','Assigned Officer','Action'])}</section><div class="two"><section class="panel" id="overlap-analysis"><div class="panel-title">⚠ Overlap Analysis <span class="pill amber">Officer review required</span></div><p class="subtle">Relationships are suggested from institution IDs. The system does not decide whether complaints are duplicates.</p>${group.length>1?group.slice(1).map(x=>`<div class="overlap" style="margin-top:9px"><b>${esc(c[0])}　↔　${esc(x[0])}</b><span class="pill ${reviewedKeys.includes(c[2])?'green':'amber'}" style="float:right">${reviewedKeys.includes(c[2])?'Reviewed':'Needs Coordination'}</span><div class="subtle">Shared institution ID · Categories: ${esc(c[4])} / ${esc(x[4])}</div></div>`).join(''):'<p class="subtle">No related case pairs available for this institution.</p>'}${btn(reviewedKeys.includes(c[2])?'Mark as Unreviewed':'Mark as Reviewed',`toggleReviewed('${esc(c[2])}')`,'small')}</section><section class="panel"><div class="panel-title">◎ Actions for Coordination</div>${btn('Link related cases',`linkCase('${esc(c[0])}')`,'wide')}<div style="height:6px"></div>${btn('Share case details with concerned Bureau/Cell',`createRequest('${esc(c[0])}')`,'wide')}<div style="height:6px"></div>${btn('Add internal note',`addNote('${esc(c[0])}')`,'wide')}<div style="height:6px"></div>${btn('Assign follow-up action',`addAction('${esc(c[0])}')`,'wide')}<div style="height:6px"></div>${btn('Set reminder',`setReminder('${esc(c[0])}')`,'wide')}</section></div>`}
function toggleReviewed(key){if(reviewedKeys.includes(key))reviewedKeys=reviewedKeys.filter(x=>x!==key);else reviewedKeys.push(key);localStorage.setItem('casesync.reviewed.v1',JSON.stringify(reviewedKeys));record('Overlap review status changed',key);render()}
function selectInstitutionCase(id){selectedId=id;institutionTab='Overview';go('institution')}
function institution(){const c=getCase(),group=cases.filter(x=>String(x[2])===String(c[2])),cnt=Object.fromEntries(['Pending','Under Process','Disposed','Transferred','Overdue'].map(s=>[s,group.filter(x=>x[6]===s).length]));return `<div class="institution" style="margin:5px 4px 16px"><div class="inst-icon">♜</div><div style="flex:1"><h1>${esc(c[1])} <span class="pill green">◆ Active</span></h1><div class="subtle">AICTE Permanent ID: ${esc(c[2])}　|　Private　|　⌖ ${esc(regionOf(c))}　|　Established: 2010</div></div>${btn('View in AICTE Portal ↗','showPortalInfo()')}</div><div class="columns"><section><div class="tabs">${['Overview','Complaints & Cases','Related Institutions','Actions History','Documents'].map(x=>`<div class="tab ${institutionTab===x?'active':''}" onclick="institutionTab='${x}';render()">${x}</div>`).join('')}</div>${institutionTab==='Overview'?`<div class="cards grid" style="grid-template-columns:repeat(5,1fr)">${kpiLine('▤','Total Complaints',group.length)}${kpiLine('◷','Pending',cnt.Pending,'amber')}${kpiLine('⚙','Under Process',cnt['Under Process'],'purple')}${kpiLine('✓','Disposed',cnt.Disposed,'green')}${kpiLine('⇄','Transferred',cnt.Transferred)}</div><section class="panel"><div class="panel-title">Complaints & Cases (${group.length}) <span class="more">${btn('+ New Complaint','newComplaint()','primary small')}</span></div>${institutionCaseTable(group)}</section><div class="two"><section class="panel"><div class="panel-title">Key Issues / Categories</div>${[...new Set(group.map(x=>x[4]))].map(cat=>`<div class="meterrow"><span style="width:140px">${esc(cat)}</span><span class="meter"><i style="width:${100*group.filter(x=>x[4]===cat).length/group.length}%"></i></span><b>${group.filter(x=>x[4]===cat).length}</b></div>`).join('')}</section><section class="panel"><div class="panel-title">Potential Overlaps / Related Cases <span class="pill amber">${Math.max(0,group.length-1)} matches</span></div>${group.slice(0,3).map(x=>`<div class="checkrow" onclick="openCase('${esc(x[0])}')"><b>${esc(x[0])}</b>　${pill(esc(x[6]))}　›</div>`).join('')}</section></div>`:institutionTab==='Complaints & Cases'?`<section class="panel"><div class="panel-title">All institution cases</div>${institutionCaseTable(group)}</section>`:institutionTab==='Actions History'?`<section class="panel"><div class="panel-title">Recent Activity</div>${group.map(x=>`<h3>${esc(x[0])}</h3>${history(x)}`).join('')}</section>`:institutionTab==='Documents'?`<section class="panel"><div class="panel-title">Institution documents</div>${group.flatMap(x=>(x[11]||[]).map((d,i)=>`<div class="checkrow">${esc(d.name)} · ${esc(x[0])} ${btn('Download',`downloadDoc('${esc(x[0])}',${i})`,'small')}</div>`)).join('')||'<p>No documents recorded.</p>'}</section>`:`<section class="panel"><div class="panel-title">Related institutions</div><p class="subtle">No verified related-institution records. Similar names are not merged automatically.</p>${btn('Review related cases',"go('related')")}</section>`}</section><section><div class="panel"><div class="panel-title">Institution Details ${btn('✎ Edit','editInstitution()','small')}</div>${[['AICTE Permanent ID',c[2]],['Institution Name',c[1]],['Type','Private'],['Address',regionOf(c)],['State / Region',regionOf(c)+' / Regional Office'],['Year of Establishment','2010'],['Current Status','Active']].map(x=>`<div class="detail-item" style="margin:9px 0"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div><div class="panel"><div class="panel-title">Cases by Bureau/Cell <span class="more" onclick="go('register')">View All →</span></div>${[...new Set(group.map(x=>x[3]))].map(b=>`<div class="meterrow"><span style="width:155px">${esc(bureauName(b))}</span><span class="meter"><i style="width:${group.length?group.filter(x=>x[3]===b).length/group.length*100:0}%"></i></span><b>${group.filter(x=>x[3]===b).length}</b></div>`).join('')}</div><div class="panel"><div class="panel-title">Recent Activity <span class="more" onclick="institutionTab function editInstitution(){const c=getCase();pop(`<h2>Edit Institution Profile</h2><form id="editInst"><label>Institution name</label><input name="name" value="${esc(c[1])}" required><div class="field"><label>AICTE Permanent ID</label><input name="id" value="${esc(c[2])}" required></div><br><button class="btn">Cancel</button> <button class="btn primary">Save profile</button></form>`);document.getElementById('editInst').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);cases.filter(x=>String(x[2])===String(c[2])).forEach(x=>{x[1]=d.get('name');x[2]=d.get('id')});record('Institution profile updated',d.get('name'));saveDB();closeModal();render()}}

function deleteSchedule(i){if(!confirm('Remove this local demo schedule?'))return;reportSchedules.splice(i,1);localStorage.setItem('casesync.schedules.v1',JSON.stringify(reportSchedules));render()}
function go(p){current=p;render();window.scrollTo(0,0)}
function render(){sidebar();const map={home,register,institution,related,coord,requests:requestPage,detail,reports,users,settings,simulator};const html=map[current]?map[current]():current==='audit'?auditPage():placeholder('Dashboard');document.getElementById('main').innerHTML=`<section class="screen active">${html}</section>`;if(current==='register')drawRegister();if(current==='requests')drawRequests();if(current==='audit')drawAudit();if(current==='related')drawRelated();if(current==='coord')drawCoord();const badge=document.getElementById('alertCount');if(badge){const count=cases.filter(c=>c[6]==='Overdue').length+requestsDB.filter(r=>['Pending','Overdue'].includes(r.status)).length;badge.textContent=count;badge.style.display=count?'':'none'}const profile=document.querySelector('.profile'),avatar=document.querySelector('.topright .avatar');if(profile)profile.innerHTML=`<b>${esc(activeUser.name)}</b><br>${esc(activeUser.role)}`;if(avatar)avatar.textContent=activeUser.name.split(' ').map(x=>x[0]).join('');const g=document.querySelector('.global-search input');if(g){g.onkeydown=e=>{if(e.key==='Enter'){go('register');const q=document.getElementById('f-q');if(q){q.value=g.value;drawRegister()}}};g.oninput=()=>{const q=g.value.toLowerCase();const matches=cases.filter(c=>c.slice(0,5).join(' ').toLowerCase().includes(q)).length;if(q.length>2)g.title=`${matches} case matches · press Enter to open register`}}}
function resetDemo(){if(!confirm('Reset this browser to the prepared CaseSync judge data? Your local demo changes will be cleared.'))return;Object.values(DB).forEach(k=>localStorage.removeItem(k));localStorage.removeItem('casesync.reviewed.v1');localStorage.removeItem('casesync.schedules.v1');location.reload()}

let simResult=null,simCaseId='CMP-RB-2026-003421';
function simulator(){const c=cases.find(x=>x[0]===simCaseId)||cases[0],group=cases.filter(x=>String(x[2])===String(c?.[2])).slice(0,4);return head('What-if Coordination Simulator','Simulate the impact of a proposed coordination action on related cases, deadlines and dependencies.',btn('ⓘ View Guide','simGuide()'))+`<div class="sim-top"><section class="panel"><h3>Select Base Case</h3><input class="input" id="sim-search" list="sim-case-options" placeholder="⌕  Search complaint ID or institution..." value="${esc(c?.[0]||'')}"><datalist id="sim-case-options">${cases.map(x=>`<option value="${esc(x[0])}">${esc(x[1])} · ${esc(x[3])} · ${esc(x[6])}</option>`).join('')}</datalist><div id="sim-case" class="sim-case"><strong>${esc(c?.[0]||'')}</strong> ${pill(c?.[6]||'')}<p>${esc(c?.[1]||'')}<br>${esc(c?.[4]||'')} &nbsp; | &nbsp; ${esc(c?.[3]||'')} &nbsp; | &nbsp; ${esc(c?.[5]||'')}</p><small>${esc(c?.[9]||'')}</small></div></section><section class="panel"><h3>Proposed Coordination Action</h3><div class="sim-form"><label>Action Type<select id="sim-action"><option>Share Inspection Report</option><option>Joint Institution Review</option><option>Request Missing Documents</option><option>Consolidate Case Updates</option></select></label><label>To Bureau / Cell<select id="sim-bureau"><option>PGRC - Public Grievance Redressal Cell</option><option>RB - Regulation Bureau</option><option>Academic Cell</option><option>APC - Approval Process Cell</option></select></label><label>Proposed Date<input id="sim-date" type="date" value="2026-10-29"></label><label>Response Deadline<input id="sim-deadline" type="date" value="2026-11-05"></label><label class="wide">Note (Optional)<textarea id="sim-note" rows="2" placeholder="Add context for this coordination action">Share latest inspection findings to support complaint resolution.</textarea></label><button class="btn primary wide" onclick="runSimulation()">▷ &nbsp; Run Simulation</button></div></section><section class="panel"><h3>Current Coordination Risks (Before Action)</h3>${[['High','1 coordination gap','RB awaiting compliance details from PGRC','red'],['Medium','1 potential conflict','Different action timelines for similar issue','amber'],['Medium','Possible duplicate effort','Two separate verification processes running','blue'],['High','2 deadlines at risk','05 Nov 2026, 12 Nov 2026','purple']].map(a=>`<div class="risk ${a[3]}"><b>${a[0]}</b><span><strong>${a[1]}</strong><small>${a[2]}</small></span><span>›</span></div>`).join('')}</section></div><div class="sim-bottom"><section class="panel"><h3>Impact on Related Cases</h3><div class="table-wrap"><table><thead><tr><th>#</th><th>Complaint ID</th><th>Bureau / Cell</th><th>Current Deadline</th><th>Current Status</th><th>Status After Simulation</th><th>Impact</th></tr></thead><tbody>${group.map((x,i)=>{let outcome=simResult&&i<2?(i===0?'Deadline Likely Met':'Delay Reduced'):'No Change';return `<tr><td>${i+1}</td><td><a onclick="openCase('${x[0]}')">${esc(x[0])}</a></td><td>${esc(x[3])}</td><td>${esc(x[8]||'—')}</td><td>${pill(x[6])}</td><td>${simResult&&i===1?pill('Under Process'):pill(x[6])}</td><td><span class="impact ${simResult&&i<2?'good':''}">${outcome}</span></td></tr>`}).join('')}</tbody></table></div><h3 style="margin-top:22px">Timeline Comparison</h3><div class="sim-timeline">${group.map((x,i)=>`<div><b>${esc(x[0])}</b><span class="track"><i style="width:${35+i*10}%"></i>${simResult?'<em style="width:55%"></em>':''}</span><small>${esc(x[8]||'No deadline')}</small></div>`).join('')}</div></section><aside><section class="panel"><h3>Impact Summary (After Simulation)</h3><div class="impact-grid"><div>◷ <b>${simResult?'2':'—'}</b><small>Deadlines Likely Met</small></div><div>⚠ <b>${simResult?'0':'—'}</b><small>New Conflicts</small></div><div>↗ <b>${simResult?'1':'—'}</b><small>Duplicate Effort Reduced</small></div><div>☷ <b>${simResult?group.length:'—'}</b><small>Cases Progressing</small></div></div><div class="recommend"><b>★ &nbsp; Overall Impact</b><p>${simResult?'Proposed coordination is likely to reduce delay risk for 2 cases and progress '+group.length+' related cases without creating new conflicts.':'Run a simulation to see the projected impact and recommended next steps.'}</p></div></section><section class="panel"><h3>Recommended Next Steps</h3><ol class="steps"><li>Proceed with proposed coordination action</li><li>Set response deadline and notify selected bureau</li><li>Monitor linked cases after action</li><li>Review outcome when response arrives</li></ol><button class="btn primary full" onclick="createSimRequest()">➤ &nbsp; Create Coordination Request with These Details</button></section></aside></div>`}
function runSimulation(){const q=document.getElementById('sim-search').value.trim().toLowerCase(),found=cases.find(x=>x[0].toLowerCase()===q)||cases.find(x=>x[1].toLowerCase()===q);if(!found){notify('Select a complaint from the suggestions before running the simulation.');document.getElementById('sim-search').focus();return}simCaseId=found[0];simResult={action:document.getElementById('sim-action').value,bureau:document.getElementById('sim-bureau').value,date:document.getElementById('sim-date').value,deadline:document.getElementById('sim-deadline').value,note:document.getElementById('sim-note').value,at:new Date().toISOString()};if(simResult.date&&simResult.deadline&&simResult.deadline<simResult.date){notify('Response deadline must be on or after the proposed action date.');return}record('What-if simulation run',simResult.action+' for '+simCaseId);render()}
function simGuide(){pop('<h2>What-if Simulator Guide</h2><p>Choose a complaint, set a proposed coordination action and response deadline, then run the simulation. The projected impact is a synthetic decision-support preview and does not update complaint records.</p><p>When the scenario looks useful, create a coordination request to add it to the demo workflow.</p>')}
function createSimRequest(){const c=cases.find(x=>x[0]===simCaseId)||cases[0];selectedId=c[0];createRequest(c[0])}

go(current);
</script></body></html>
